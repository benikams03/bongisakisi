<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bongisakisi - Chargement</title>
    <script src="./tailwindcss.js"></script>
    <style>
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .spinner {
            animation: spin 1s linear infinite;
        }
    </style>
</head>
<body class="bg-transparent">
    <div class="h-screen bg-white flex items-center justify-center rounded-lg">
        <div class="text-center">
            <!-- Logo -->
            <div class="mb-8">
                <img src="./../../resources/logo.png" alt="BongisaKisi" class="w-20 h-20 mx-auto mb-4">
                <h1 class="text-2xl font-semibold text-gray-800 mb-1">BongisaKisi</h1>
                <p class="text-gray-500 text-sm">Pharmacie Management</p>
            </div>

            <!-- Spinner -->
            <div class="flex justify-center mb-4">
                <svg class="spinner w-8 h-8 text-emerald-600" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </div>

            <!-- Loading text -->
            <p id="loading-text" class="text-gray-600 text-sm">Chargement...</p>
        </div>
    </div>

    <script>
        const loadingTexts = [
            'Initialisation...',
            'Chargement des données...',
            'Préparation de l\'interface...',
            'Prêt à démarrer...'
        ];

        const loadingText = document.getElementById('loading-text');
        let currentIndex = 0;

        const interval = setInterval(() => {
            currentIndex = (currentIndex + 1) % loadingTexts.length;
            loadingText.textContent = loadingTexts[currentIndex];
        }, 1300);
    </script>
</body>
</html>
